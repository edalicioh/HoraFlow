name: horaflow-f0

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: horaflow:phase-0
    container_name: horaflow-f0
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${HORFLOW_PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/data/horaflow.db
      NODE_ENV: production
    volumes:
      - horaflow-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  horaflow-data:
    name: horaflow-f0-data
